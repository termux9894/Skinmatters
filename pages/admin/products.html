<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Products – SkinMatters Admin</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/admin.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .product-thumb { width:48px; height:48px; border-radius:6px; object-fit:cover; background:var(--admin-bg); }
    .toggle-switch { position:relative; display:inline-block; width:40px; height:22px; }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; cursor:pointer; inset:0; background:var(--admin-border); border-radius:22px; transition:.3s; }
    .toggle-slider:before { position:absolute; content:''; height:16px; width:16px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.3s; }
    input:checked + .toggle-slider { background:var(--admin-accent); }
    input:checked + .toggle-slider:before { transform:translateX(18px); }
  </style>
</head>
<body class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <h1>Products</h1>
      <div class="topbar-right">
        <button class="admin-btn admin-btn-primary" onclick="openProductModal()">+ Add Product</button>
        <div class="admin-avatar" id="adminAvatar">A</div>
      </div>
    </div>

    <div class="admin-content">
      <div id="adminAlert" class="admin-alert" style="display:none"></div>

      <div class="admin-toolbar">
        <div class="admin-search">
          <i class="fa fa-search" style="color:var(--admin-muted)"></i>
          <input type="text" id="searchInput" placeholder="Search products…" oninput="filterProducts()"/>
        </div>
        <div class="admin-filter">
          <select id="catFilter" onchange="filterProducts()">
            <option value="">All Categories</option>
            <option value="soap">Soaps</option>
            <option value="oil">Oils & Serums</option>
            <option value="balm">Balms</option>
            <option value="pack">Packs</option>
          </select>
        </div>
        <div class="admin-filter">
          <select id="stockFilter" onchange="filterProducts()">
            <option value="">All Stock</option>
            <option value="low">Low Stock (&lt;10)</option>
            <option value="out">Out of Stock</option>
          </select>
        </div>
      </div>

      <div class="admin-table-wrap">
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Rating</th>
                <th>Active</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsBody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--admin-muted)"><i class="fa fa-spinner fa-spin"></i> Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL -->
  <div class="admin-modal-overlay" id="productModal" style="display:none">
    <div class="admin-modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 id="modalTitle">Add New Product</h3>
        <button onclick="closeProductModal()" style="color:var(--admin-muted);font-size:1.1rem;background:none;border:none;cursor:pointer">✕</button>
      </div>

      <input type="hidden" id="editProductId"/>

      <div class="admin-form-row">
        <div class="admin-form-group"><label>Product Name *</label><input type="text" id="pName" placeholder="e.g. Aloe Vera Soap"/></div>
        <div class="admin-form-group"><label>Tagline</label><input type="text" id="pTagline" placeholder="e.g. Soothe & Glow"/></div>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-group">
          <label>Category *</label>
          <select id="pCategory">
            <option value="">Select category</option>
            <option value="soap">Soap</option>
            <option value="oil">Oil & Serum</option>
            <option value="balm">Balm</option>
            <option value="pack">Pack</option>
          </select>
        </div>
        <div class="admin-form-group"><label>Badge</label><input type="text" id="pBadge" placeholder="e.g. Best Seller, New"/></div>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-group"><label>Price (₹) *</label><input type="number" id="pPrice" placeholder="180"/></div>
        <div class="admin-form-group"><label>Original Price (₹)</label><input type="number" id="pOriginal" placeholder="220 (leave blank if no discount)"/></div>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-group"><label>Stock Quantity</label><input type="number" id="pStock" placeholder="100"/></div>
        <div class="admin-form-group"><label>Weight (grams)</label><input type="number" id="pWeight" placeholder="100"/></div>
      </div>
      <div class="admin-form-group"><label>Image Path</label><input type="text" id="pImage" placeholder="images/aloe-vera-soap.png"/></div>
      <div class="admin-form-group"><label>Description *</label><textarea id="pDesc" placeholder="Describe the product, its benefits and key ingredients…"></textarea></div>
      <div class="admin-form-group"><label>How to Use</label><textarea id="pHowTo" style="min-height:70px" placeholder="Apply on wet skin, lather gently, rinse off…"></textarea></div>
      <div class="admin-form-group">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <label class="toggle-switch"><input type="checkbox" id="pActive" checked/><span class="toggle-slider"></span></label>
          Active (visible to customers)
        </label>
      </div>
      <div class="admin-form-group">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <label class="toggle-switch"><input type="checkbox" id="pFeatured"/><span class="toggle-slider"></span></label>
          Featured (shown on homepage)
        </label>
      </div>

      <div class="modal-footer">
        <button class="admin-btn admin-btn-outline" onclick="closeProductModal()">Cancel</button>
        <button class="admin-btn admin-btn-primary" id="saveProductBtn" onclick="saveProduct()">Save Product</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config/supabase.js"></script>
  <script src="../../js/config/paths.js"></script>
  <script src="../../js/admin/admin.js"></script>
  <script>
    let allProducts = [];
    let currentPage = 1;
    const PER_PAGE  = 20;

    document.addEventListener('DOMContentLoaded', async () => {
      const admin = await requireAdmin();
      if (!admin) return;
      injectAdminSidebar('products');
      await loadProducts();
    });

    async function loadProducts() {
      const { data, error } = await supabase.from('products').select('*').order('id');
      if (error) { showAdminAlert('Failed to load products: ' + error.message, 'error'); return; }
      allProducts = data || [];
      renderProducts(allProducts, currentPage);
    }

    function renderProducts(products, page) {
      const start = (page - 1) * PER_PAGE;
      const paged = products.slice(start, start + PER_PAGE);
      const tbody = document.getElementById('productsBody');
      if (!paged.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--admin-muted)">No products found</td></tr>';
        return;
      }
      tbody.innerHTML = paged.map(p => `
        <tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <img class="product-thumb" src="../../${p.image_url || ''}" alt="${p.name}" onerror="this.src='https://placehold.co/48x48/161b22/fff?text=P'"/>
              <div>
                <p style="font-weight:500;font-size:0.85rem">${p.name}</p>
                <p style="font-size:0.72rem;color:var(--admin-muted)">${p.tagline || ''}</p>
              </div>
            </div>
          </td>
          <td><span class="badge badge-gray">${p.category_slug || '–'}</span></td>
          <td>
            <strong>${adminFormatPrice(p.price)}</strong>
            ${p.original_price ? `<br/><span style="font-size:0.75rem;color:var(--admin-muted);text-decoration:line-through">${adminFormatPrice(p.original_price)}</span>` : ''}
          </td>
          <td>
            <span class="badge ${(p.stock_quantity || 0) <= 0 ? 'badge-red' : (p.stock_quantity || 0) <= 10 ? 'badge-amber' : 'badge-green'}">
              ${p.stock_quantity || 0} units
            </span>
          </td>
          <td>⭐ ${p.rating || 0} <span style="color:var(--admin-muted);font-size:0.75rem">(${p.reviews_count || 0})</span></td>
          <td>
            <label class="toggle-switch">
              <input type="checkbox" ${p.is_active ? 'checked' : ''} onchange="toggleActive('${p.id}', this.checked)"/>
              <span class="toggle-slider"></span>
            </label>
          </td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="editProduct('${p.id}')">Edit</button>
              <button class="admin-btn admin-btn-danger admin-btn-sm" onclick="deleteProduct('${p.id}', '${p.name.replace(/'/g,"\\'")}')">Delete</button>
            </div>
          </td>
        </tr>`).join('');
      renderPagination(products.length, page, PER_PAGE, (p) => { currentPage = p; renderProducts(products, p); });
    }

    function filterProducts() {
      const q     = document.getElementById('searchInput').value.toLowerCase();
      const cat   = document.getElementById('catFilter').value;
      const stock = document.getElementById('stockFilter').value;
      let filtered = allProducts.filter(p => {
        const matchQ = !q || p.name.toLowerCase().includes(q) || (p.tagline || '').toLowerCase().includes(q);
        const matchC = !cat || p.category_slug === cat;
        const matchS = !stock
          || (stock === 'low'  && p.stock_quantity > 0  && p.stock_quantity < 10)
          || (stock === 'out'  && p.stock_quantity <= 0);
        return matchQ && matchC && matchS;
      });
      currentPage = 1;
      renderProducts(filtered, 1);
    }

    function openProductModal(id = null) {
      document.getElementById('editProductId').value = '';
      document.getElementById('modalTitle').textContent = 'Add New Product';
      ['pName','pTagline','pCategory','pBadge','pPrice','pOriginal','pStock','pWeight','pImage','pDesc','pHowTo'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('pActive').checked   = true;
      document.getElementById('pFeatured').checked = false;
      document.getElementById('productModal').style.display = 'flex';
    }

    function editProduct(id) {
      const p = allProducts.find(x => x.id == id);
      if (!p) return;
      document.getElementById('editProductId').value  = p.id;
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('pName').value      = p.name || '';
      document.getElementById('pTagline').value   = p.tagline || '';
      document.getElementById('pCategory').value  = p.category_slug || '';
      document.getElementById('pBadge').value     = p.badge || '';
      document.getElementById('pPrice').value     = p.price || '';
      document.getElementById('pOriginal').value  = p.original_price || '';
      document.getElementById('pStock').value     = p.stock_quantity || '';
      document.getElementById('pWeight').value    = p.weight_grams || '';
      document.getElementById('pImage').value     = p.image_url || '';
      document.getElementById('pDesc').value      = p.description || '';
      document.getElementById('pHowTo').value     = p.how_to_use || '';
      document.getElementById('pActive').checked   = p.is_active;
      document.getElementById('pFeatured').checked = p.is_featured;
      document.getElementById('productModal').style.display = 'flex';
    }

    async function saveProduct() {
      const name     = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value;
      const price    = parseFloat(document.getElementById('pPrice').value);

      if (!name || !category || !price) { showAdminAlert('Name, category and price are required.', 'error'); return; }

      const btn = document.getElementById('saveProductBtn');
      btn.disabled = true; btn.textContent = 'Saving…';

      const payload = {
        name,
        tagline:        document.getElementById('pTagline').value.trim() || null,
        category_slug:  category,
        badge:          document.getElementById('pBadge').value.trim() || null,
        price,
        original_price: parseFloat(document.getElementById('pOriginal').value) || null,
        stock_quantity: parseInt(document.getElementById('pStock').value) || 100,
        weight_grams:   parseInt(document.getElementById('pWeight').value) || null,
        image_url:      document.getElementById('pImage').value.trim() || null,
        description:    document.getElementById('pDesc').value.trim() || null,
        how_to_use:     document.getElementById('pHowTo').value.trim() || null,
        is_active:      document.getElementById('pActive').checked,
        is_featured:    document.getElementById('pFeatured').checked,
        slug:           name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
      };

      const editId = document.getElementById('editProductId').value;
      let error;

      if (editId) {
        ({ error } = await supabase.from('products').update(payload).eq('id', editId));
      } else {
        ({ error } = await supabase.from('products').insert(payload));
      }

      btn.disabled = false; btn.textContent = 'Save Product';

      if (error) { showAdminAlert('Error: ' + error.message, 'error'); return; }
      showAdminAlert(editId ? 'Product updated!' : 'Product added!', 'success');
      closeProductModal();
      await loadProducts();
    }

    async function toggleActive(id, active) {
      const { error } = await supabase.from('products').update({ is_active: active }).eq('id', id);
      if (error) { showAdminAlert('Update failed', 'error'); return; }
      const p = allProducts.find(x => x.id == id);
      if (p) p.is_active = active;
    }

    function deleteProduct(id, name) {
      confirmDelete(`Delete "${name}"? This cannot be undone.`, async () => {
        const { error } = await supabase.from('products').delete().eq('id', id);
        if (error) { showAdminAlert('Delete failed: ' + error.message, 'error'); return; }
        showAdminAlert('Product deleted.', 'success');
        await loadProducts();
      });
    }

    function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
    document.getElementById('productModal').addEventListener('click', function(e) { if (e.target === this) closeProductModal(); });
  </script>
</body>
</html>
