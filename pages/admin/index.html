<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login – SkinMatters</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/admin.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background: var(--admin-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap { width: 100%; max-width: 400px; padding: 24px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 400; color: #fff; }
    .login-logo h1 span { color: var(--admin-accent); }
    .login-logo p { color: var(--admin-muted); font-size: 0.82rem; margin-top: 4px; }
    .login-card { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: 12px; padding: 32px; }
    .login-card h2 { font-family: var(--font-display); font-size: 1.4rem; color: #fff; font-weight: 400; margin-bottom: 6px; }
    .login-card p  { color: var(--admin-muted); font-size: 0.83rem; margin-bottom: 24px; }
    .btn-full { width: 100%; padding: 12px; border-radius: 8px; background: var(--admin-accent); color: #0f1117; font-weight: 700; font-size: 0.9rem; border: none; cursor: pointer; transition: opacity .2s; }
    .btn-full:hover { opacity: 0.88; }
    .err-msg { color: var(--admin-red); font-size: 0.82rem; margin-top: 10px; text-align: center; display: none; }
    .back-link { text-align: center; margin-top: 20px; font-size: 0.82rem; }
    .back-link a { color: var(--admin-blue); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <h1>Skin<span>Matters</span></h1>
      <p>Admin Panel · Restricted Access</p>
    </div>
    <div class="login-card">
      <h2>Welcome back</h2>
      <p>Sign in with your admin account to continue.</p>

      <div class="admin-form-group">
        <label>Email Address</label>
        <input type="email" id="adminEmail" placeholder="admin@skinmatters.in"/>
      </div>
      <div class="admin-form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Your password"/>
      </div>
      <button class="btn-full" id="loginBtn" onclick="doAdminLogin()">
        Sign In to Admin Panel
      </button>
      <p class="err-msg" id="errMsg">Invalid credentials or not an admin account.</p>
    </div>
    <div class="back-link">
      <a href="../../index.html">← Back to SkinMatters</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/config/supabase.js"></script>
  <script src="../../js/config/paths.js"></script>
  <script>
    // If already logged in and admin → go straight to dashboard
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user) {
        const profile = await getUserProfile(user.id);
        if (profile?.is_admin) {
          window.location.href = 'dashboard.html';
        }
      }
    });

    async function doAdminLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const pw    = document.getElementById('adminPassword').value;
      const btn   = document.getElementById('loginBtn');
      const err   = document.getElementById('errMsg');
      err.style.display = 'none';

      if (!email || !pw) { err.textContent = 'Please enter email and password.'; err.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Signing in…';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });

      if (error) {
        err.textContent = 'Login failed: ' + error.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In to Admin Panel';
        return;
      }

      const profile = await getUserProfile(data.user.id);
      if (!profile?.is_admin) {
        await supabase.auth.signOut();
        err.textContent = 'This account does not have admin access.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In to Admin Panel';
        return;
      }

      window.location.href = 'dashboard.html';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
  </script>
</body>
</html>
