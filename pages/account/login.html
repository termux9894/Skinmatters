<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register – SkinMatters</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .auth-wrap { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .auth-box { width: 100%; max-width: 460px; }
    .auth-box .form-card { padding: 44px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo { justify-content: center; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 28px; }
    .auth-tab { flex: 1; text-align: center; padding: 12px; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; cursor: pointer; transition: var(--transition); }
    .auth-tab.active { color: var(--brown); border-bottom-color: var(--brown); }
    .btn-full { width: 100%; }
    .social-auth { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 0.88rem; font-weight: 500; background: var(--warm-white); transition: var(--transition); width: 100%; cursor: pointer; }
    .btn-social:hover { border-color: var(--brown-light); background: #fdf7f2; }
    .btn-social img { width: 18px; height: 18px; }
    .btn-social:disabled { opacity: 0.6; cursor: not-allowed; }
    .forgot-link { font-size: 0.8rem; color: var(--brown); text-align: right; display: block; margin-top: -10px; margin-bottom: 20px; }
    .forgot-link:hover { text-decoration: underline; }
    .pw-toggle { position: relative; }
    .pw-toggle input { padding-right: 44px; }
    .pw-toggle button { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); background: none; border: none; cursor: pointer; }
    .strength-bar { height: 4px; border-radius: 4px; margin-top: 6px; background: var(--border); overflow: hidden; }
    .strength-fill { height: 100%; width: 0; border-radius: 4px; transition: width 0.3s, background 0.3s; }
    .terms-check { display: flex; align-items: flex-start; gap: 10px; font-size: 0.82rem; color: var(--text-muted); }
    .terms-check input { margin-top: 2px; accent-color: var(--brown); flex-shrink: 0; }
    .terms-check a { color: var(--brown); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="announcement-bar" id="announcementBar"></div>
<header class="header" id="siteHeader"></header>
<div id="cartSidebarWrap"></div>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <a href="../../index.html" class="logo">
        <span class="logo-leaf">🌿</span>
        <div class="logo-text"><span class="logo-main">SkinMatters</span><span class="logo-sub">Pure Naturals</span></div>
      </a>
    </div>
    <div class="form-card">
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">Login</div>
        <div class="auth-tab" onclick="switchTab('register')">Create Account</div>
      </div>

      <!-- LOGIN -->
      <div id="loginPanel">
        <div class="social-auth">
          <button id="googleBtn" class="btn-social" onclick="loginWithGoogle()">
            <i class="fa-brands fa-google"></i>
            Continue with Google
          </button>
        </div>

        <div class="form-divider">or login with email</div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="pw-toggle">
            <input type="password" id="loginPassword" placeholder="Enter your password" />
            <button type="button" onclick="togglePw('loginPassword', this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>

        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

        <button class="btn btn-dark btn-full" onclick="handleLogin()" id="loginBtn">
          Login to My Account
        </button>

        <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--text-muted);">
          Don't have an account?
          <a href="#" onclick="switchTab('register')" style="color:var(--brown);">Sign up free</a>
        </p>
      </div>

      <!-- REGISTER -->
      <div id="registerPanel" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="regFirst" placeholder="Priya" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="regLast" placeholder="Sharma" />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="+91 98765 43210" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="pw-toggle">
            <input type="password" id="regPassword" placeholder="Min. 8 characters" oninput="checkStrength(this.value)" />
            <button type="button" onclick="togglePw('regPassword',this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <p class="form-hint" id="strengthText">Enter a password</p>
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label class="terms-check">
            <input type="checkbox" id="termsCheck" />
            I agree to the
            <a href="../../pages/support/shipping.html">Terms of Service</a>
            and
            <a href="../../pages/support/returns.html">Privacy Policy</a>
          </label>
        </div>

        <button class="btn btn-dark btn-full" onclick="handleRegister()" id="registerBtn">
          Create My Account
        </button>

        <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--text-muted);">
          Already have an account?
          <a href="#" onclick="switchTab('login')" style="color:var(--brown);">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>

<footer class="footer" id="siteFooter"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../js/config/supabase.js"></script>
<script src="../../js/config/paths.js"></script>

<script src="../../js/auth/auth.js"></script>
<script src="../../js/cart/cart.js"></script>
<script src="../../js/wishlist/wishlist.js"></script>

<script src="../../js/ui/layout.js"></script>
<script src="../../js/ui/main.js"></script>

<script>
  // ── AUTO-REDIRECT IF ALREADY LOGGED IN ──────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    initLayout();
    // Initialise auth state
    if (typeof initAuth === 'function') {
      await initAuth();
    }
    // Check if already logged in
    const user = loadUserFromLocal();
    if (user) {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || PAGES.account;
      window.location.href = redirect;
    }
  });

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('loginPanel').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerPanel').style.display = tab === 'register' ? 'block' : 'none';
  }

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = `<i class="fa fa-eye${show ? '-slash' : ''}"></i>`;
  }

  function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const txt = document.getElementById('strengthText');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = ['', '25%', '50%', '75%', '100%'];
    const colors = ['', '#e53e3e', '#f5a623', '#3a6b35', '#27ae60'];
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    fill.style.width = levels[score];
    fill.style.background = colors[score];
    txt.textContent = score ? labels[score] : 'Enter a password';
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');

    if (!email || !pw) {
      showToast('Please fill in all fields', 'error');
      return;
    }

    // Disable button to prevent double-click
    if (btn) { btn.disabled = true; btn.textContent = 'Logging in…'; }

    await loginWithEmail(email, pw);

    // Re-enable if login failed (user will still be on this page)
    if (btn) { btn.disabled = false; btn.textContent = 'Login to My Account'; }
  }

  async function handleRegister() {
    const first = document.getElementById('regFirst').value.trim();
    const last = document.getElementById('regLast').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const pw = document.getElementById('regPassword').value;
    const terms = document.getElementById('termsCheck').checked;
    const btn = document.getElementById('registerBtn');

    if (!first || !last || !email || !pw) {
      showToast('Please fill in all fields', 'error');
      return;
    }

    if (!terms) {
      showToast('Please accept the terms', 'error');
      return;
    }

    if (pw.length < 8) {
      showToast('Password must be 8+ characters', 'error');
      return;
    }

    // Disable button to prevent double-click
    if (btn) { btn.disabled = true; btn.textContent = 'Creating account…'; }

    await registerWithEmail(first, last, email, phone, pw);

    // Re-enable if registration failed
    if (btn) { btn.disabled = false; btn.textContent = 'Create My Account'; }
  }
</script>
</body>
</html>
