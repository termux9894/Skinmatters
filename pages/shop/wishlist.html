<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist – SkinMatters</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .wishlist-wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }
    .wishlist-wrap h2 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 28px; }
    .wishlist-product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: var(--transition); position: relative; }
    .wishlist-product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .wl-remove { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #e53e3e; z-index: 1; transition: var(--transition); cursor: pointer; }
    .wl-remove:hover { background: #e53e3e; color: #fff; }
    .wl-img { height: 200px; background: var(--warm-white); overflow: hidden; }
    .wl-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .wishlist-product-card:hover .wl-img img { transform: scale(1.05); }
    .wl-body { padding: 16px; }
    .wl-name { font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 6px; }
    .wl-price { font-size: 1rem; font-weight: 600; color: var(--brown); margin-bottom: 12px; }
    .wishlist-actions { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

<div class="announcement-bar" id="announcementBar"></div>
<header class="header" id="siteHeader"></header>
<div id="cartSidebarWrap"></div>

<section class="page-hero-sm">
  <span class="section-tag">Saved Items</span>
  <h1>My <em>Wishlist</em></h1>
  <p>Products you've saved for later. Add them to cart whenever you're ready.</p>
</section>

<div class="wishlist-wrap">
  <div id="wishlistContent"></div>
</div>

<footer class="footer" id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../js/config/supabase.js"></script>
<script src="../../js/config/paths.js"></script>

<script src="../../js/auth/auth.js"></script>
<script src="../../js/wishlist/wishlist.js"></script>

<script src="../../js/products-data.js"></script>
<script src="../../js/ui/layout.js"></script>
<script src="../../js/ui/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {

  initLayout();

  await initWishlist();

  await renderWishlist();

});

async function renderWishlist() {

  const container = document.getElementById('wishlistContent');

  const items = await getWishlistItems();

  if (!items.length) {

    container.innerHTML = `
      <div class="wishlist-empty" style="text-align:center;padding:60px;">
        <i class="fa fa-heart" style="font-size:3rem;margin-bottom:20px;color:#ccc;"></i>

        <h2>Your wishlist is empty</h2>

        <p>Save products you love and they will appear here.</p>

        <a href="../shop/products.html" class="btn btn-dark">
          Explore Products
        </a>
      </div>
    `;

    return;
  }

  container.innerHTML = `
    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
    ">
      <h2>${items.length} Saved Item${items.length > 1 ? 's' : ''}</h2>
    </div>

    <div class="wishlist-grid">

      ${items.map(product => `

        <div class="wishlist-product-card">

          <button
            class="wl-remove"
            onclick="removeWishlistAndRefresh(${product.id})">

            <i class="fa fa-times"></i>

          </button>

          <a
            href="../shop/product.html?id=${product.id}"
            class="wl-img">

            <img
              src="../../${product.image_url}"
              alt="${product.name}"
              onerror="this.src='https://placehold.co/400x400/f5f0eb/888?text=Product'">

          </a>

          <div class="wl-body">

            <h3 class="wl-name">
              <a href="../shop/product.html?id=${product.id}">
                ${product.name}
              </a>
            </h3>

            <p class="wl-price">
              ₹${product.price}
            </p>

            <div class="wishlist-actions">

              <button
                class="btn btn-dark"
                onclick="moveToCartAndRefresh(${product.id})">

                <i class="fa fa-shopping-bag"></i>
                Add To Cart

              </button>

            </div>

          </div>

        </div>

      `).join('')}

    </div>
  `;
}

async function removeWishlistAndRefresh(id) {

  await removeFromWishlist(id);

  await renderWishlist();

  showToast('Removed from wishlist ❤️', 'success');
}

async function moveToCartAndRefresh(id) {

  await addToCart(id);

  await removeFromWishlist(id);

  await renderWishlist();

  showToast('Moved to cart 🛒', 'success');
}
</script>
</body>
</html>
